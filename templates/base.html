<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}School Seat Assigner{% endblock %}</title>
    <!-- Simple CSS framework for quick styling -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/picnic">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { padding: 2em; max-width: 1200px; margin: 0 auto; }
        .nav { padding: 1em 0; margin-bottom: 2em; border-bottom: 1px solid #eee; }
        .nav a { margin-right: 1em; }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <header>
        <div class="nav">
            <a href="/"><i class="fa-solid fa-house"></i> Home</a>
            {% if class_name %}
            &raquo; <a href="/class/{{ class_name }}"><strong>{{ class_name }}</strong></a>
            <a href="/class/{{ class_name }}/layout" class="button pseudo"><i class="fa-solid fa-border-all"></i> Seat Layout</a>
            <a href="/class/{{ class_name }}/pupils" class="button pseudo"><i class="fa-solid fa-users"></i> Pupils</a>
            <a href="/class/{{ class_name }}/preferences" class="button pseudo"><i class="fa-solid fa-heart"></i> Prefs</a>
            <a href="/class/{{ class_name }}/teacher" class="button pseudo"><i class="fa-solid fa-scale-balanced"></i> Rules</a>
            <a href="/class/{{ class_name }}/assign" class="button pseudo"><i class="fa-solid fa-ranking-star"></i> Assignment</a>
            {% endif %}
        </div>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
