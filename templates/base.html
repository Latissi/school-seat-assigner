<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}School Seat Assigner{% endblock %}</title>
    <!-- Simple CSS framework for quick styling -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/picnic">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { padding: 2em; max-width: 1200px; margin: 0 auto; }
        .nav { padding: 1em 0; margin-bottom: 2em; border-bottom: 1px solid #eee; }
        .nav a { margin-right: 1em; }
        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; }
        .toast { padding: 10px 20px; border-radius: 4px; color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); opacity: 0; transition: opacity 0.3s; }
        .toast.show { opacity: 1; }
        .toast.success { background-color: #1e90ff; } /* Matches Picnic default */
        .toast.error { background-color: #d9534f; }   /* Matches Picnic error */
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <div id="toast-container"></div>
    <script>
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            
            setTimeout(() => toast.classList.add('show'), 10);
            
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        /**
         * Non-blocking inline delete confirmation.
         * On first click the button enters a "Sure?" state with a Cancel sibling.
         * On second click the callback fires. Auto-reverts after 3 s.
         */
        function confirmDelete(btn, onConfirm) {
            if (btn.dataset.confirming) {
                // Second click — execute
                const cancel = btn._cancelBtn;
                if (cancel) cancel.remove();
                delete btn.dataset.confirming;
                clearTimeout(btn._confirmTimer);
                onConfirm();
                return;
            }

            const origHTML = btn.innerHTML;
            const origClass = btn.className;

            function revert() {
                btn.innerHTML = origHTML;
                btn.className = origClass;
                delete btn.dataset.confirming;
                clearTimeout(btn._confirmTimer);
                if (btn._cancelBtn) { btn._cancelBtn.remove(); delete btn._cancelBtn; }
                btn.onclick = () => confirmDelete(btn, onConfirm);
            }

            btn.dataset.confirming = '1';
            btn.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Sure?';
            btn.className = 'error';
            btn._confirmTimer = setTimeout(revert, 3000);

            const cancel = document.createElement('button');
            cancel.className = 'pseudo';
            cancel.style.marginLeft = '4px';
            cancel.innerHTML = 'Cancel';
            cancel.onclick = (e) => { e.stopPropagation(); revert(); };
            btn._cancelBtn = cancel;
            btn.insertAdjacentElement('afterend', cancel);

            btn.onclick = () => confirmDelete(btn, onConfirm);
        }
    </script>
    <header>
        <div class="nav">
            <a href="/"><i class="fa-solid fa-house"></i> Home</a>
            {% if class_name %}
            &raquo; <a href="/class/{{ class_name }}"><strong>{{ class_name }}</strong></a>
            <a href="/class/{{ class_name }}/layout" class="button pseudo"><i class="fa-solid fa-border-all"></i> Seat Layout</a>
            <a href="/class/{{ class_name }}/pupils" class="button pseudo"><i class="fa-solid fa-users"></i> Pupils</a>
            <a href="/class/{{ class_name }}/preferences" class="button pseudo"><i class="fa-solid fa-heart"></i> Preferences</a>
            <a href="/class/{{ class_name }}/teacher" class="button pseudo"><i class="fa-solid fa-scale-balanced"></i> Teacher Rules</a>
            <a href="/class/{{ class_name }}/assign" class="button pseudo"><i class="fa-solid fa-ranking-star"></i> Assignment</a>
            {% endif %}
        </div>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
