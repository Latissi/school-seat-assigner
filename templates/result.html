{% extends "base.html" %}

{% block title %}Result - {{ class_name }}{% endblock %}

{% block head %}
<style>
#result-container {
    display: inline-grid;
    gap: 10px;
    background: #f0f0f0;
    padding: 10px;
    border: 1px solid #ccc;
    user-select: none;
}
.grid-cell {
    width: 90px;
    height: 90px;
    background: transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 0.85em;
    text-align: center;
    box-sizing: border-box;
    border: 1px dashed transparent;
}
.grid-cell.is-seat {
    background: #e0f7fa;
    border: 1px solid #00acc1;
    border-radius: 4px;
}
.grid-cell.assigned {
    background: #c8e6c9;
    border-color: #388e3c;
}
.teacher-desk {
    background: #4a5568;
    color: white;
    text-align: center;
    padding: 15px;
    margin-bottom: 20px;
    border-radius: 4px;
    font-weight: bold;
    letter-spacing: 1px;
}
.pupil-name {
    margin-top: 5px;
    font-weight: bold;
    color: #1a202c;
    word-break: break-word;
}

.classroom-wrapper {
    display: inline-flex;
    flex-direction: column;
    align-items: stretch;
}
.layout-editor {
    display: flex;
    gap: 1rem;
    align-items: flex-start;
    flex-wrap: nowrap;
    overflow-x: auto;
}
.layout-main {
    flex: 1 1 auto;
    min-width: 0;
}
.layout-tools {
    flex: 0 0 320px;
}
</style>

{% endblock %}

{% block content %}
<h2><i class="fa-solid fa-ranking-star"></i> Seat Assignment: {{ class_name }}</h2>

<div class="layout-editor">
    <div class="layout-main">
        <div class="classroom-wrapper">
          <div class="teacher-desk"><i class="fa-solid fa-person-chalkboard"></i> FRONT OF CLASSROOM / TEACHER DESK</div>
          <div id="result-container"></div>
        </div>
    </div>
    <div class="layout-tools">
        <div class="card" style="padding: 1em;">
            <h3><i class="fa-solid fa-gears"></i> Generate</h3>
            <button class="success" onclick="assign()"><i class="fa-solid fa-wand-magic-sparkles"></i> Re-Generate Assignment</button>
            <hr>
            <p>Score: <span id="score" style="font-weight:bold; font-size:1.2em; color: #2e7d32;">{{ assignment.score }}</span></p>
        </div>
    </div>
</div>

<script>
    const className = "{{ class_name }}";
    let layout = {{ layout | tojson | safe }};
    let assignment = {{ assignment | tojson | safe }};
    let pupils = {{ pupils | tojson | safe }};
    
    let pupilMap = {};
    if(pupils.pupils) {
        pupils.pupils.forEach(p => {
            pupilMap[p.id] = ((p.first_name || '') + ' ' + (p.last_name || p.name || '')).trim();
        });
    }
    
    function renderResult() {
        let gridRows = layout.height || 8;
        let gridCols = layout.width || 10;
        let gridSeats = layout.seats || [];
        
        if (gridSeats.length === 0 && layout.rows) {
            layout.rows.forEach((r, r_idx) => {
                let col = 0;
                r.groups.forEach(g => {
                    g.seats.forEach(s => {
                        let tag = s.tag || 'middle';
                        gridSeats.push({ id: s.id, row_idx: r_idx, col_idx: col, tag: tag });
                        col++;
                    });
                    col++;
                });
            });
        }
        
        const container = document.getElementById('result-container');
        container.style.gridTemplateRows = `repeat(${gridRows}, 90px)`;
        container.style.gridTemplateColumns = `repeat(${gridCols}, 90px)`;
        container.innerHTML = '';
        
        if (gridSeats.length === 0) {
            container.innerHTML = '<p>No layout defined. Please define a seat layout first.</p>';
            return;
        }
        
        let seatMap = {};
        gridSeats.forEach(s => { seatMap[`${s.row_idx}-${s.col_idx}`] = s; });

        for (let r = 0; r < gridRows; r++) {
            for (let c = 0; c < gridCols; c++) {
                let cell = document.createElement('div');
                cell.className = 'grid-cell';
                let key = `${r}-${c}`;
                
                if (seatMap[key]) {
                    cell.classList.add('is-seat');
                    let s = seatMap[key];
                    let pId = assignment.mapping ? assignment.mapping[s.id] : null;

                    if (pId) {
                        cell.classList.add('assigned');
                        cell.innerHTML = `<i class="fa-solid fa-user" style="color:#2e7d32; font-size: 1.5em;"></i><div class="pupil-name">${pupilMap[pId] || 'Unknown'}</div>`;
                    } else {
                        cell.innerHTML = `<i class="fa-solid fa-chair" style="color:#9e9e9e; font-size: 1.5em;"></i><div class="pupil-name" style="color: #9e9e9e; font-weight: normal;">Free Seat</div>`;
                    }
                }
                
                container.appendChild(cell);
            }
        }
        
        document.getElementById('score').innerText = assignment.score || 0;
    }

    function assign() {
        document.getElementById('score').innerText = 'Calculating...';
        fetch('/class/' + className + '/assign', {
            method: 'POST'
        }).then(res => res.json()).then(data => {
            if(data.error) {
                alert("Error: " + data.error);
                document.getElementById('score').innerText = 'Error';
            } else {
                assignment = data;
                renderResult();
            }
        });
    }

    renderResult();
</script>
{% endblock %}
