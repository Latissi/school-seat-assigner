{% extends "base.html" %}

{% block title %}Pupils - {{ class_name }}{% endblock %}

{% block content %}
<h2><i class="fa-solid fa-users"></i> Pupils: {{ class_name }}</h2>

<div class="flex two">
    <div class="two-third">
        <div class="card" style="padding: 1em;">
            <table class="primary">
                <thead>
                    <tr>
                        <th><i class="fa-solid fa-user"></i> First Name</th>
                        <th><i class="fa-solid fa-user"></i> Last Name</th>
                        <th><i class="fa-solid fa-chart-line"></i> Performance</th>
                        <th><i class="fa-solid fa-wrench"></i> Action</th>
                    </tr>
                </thead>
                <tbody id="pupil-table">
                </tbody>
            </table>
        </div>
    </div>
    <div class="one-third">
        <div class="card" style="padding: 1em;">
            <h3><i class="fa-solid fa-user-plus"></i> New Pupil</h3>
            <input type="text" id="new-pupil-first" placeholder="First Name">
            <input type="text" id="new-pupil-last" placeholder="Last Name" style="margin-top: 10px;">
            <button onclick="addPupil()" style="margin-top: 10px;"><i class="fa-solid fa-plus"></i> Add</button>
            
        </div>
    </div>
</div>

<script>
    const className = "{{ class_name }}";
    let data = {{ pupils | tojson | safe }};
    if(!data.pupils) data.pupils = [];

    // Fallback: migrate old 'name' string to 'first_name' and 'last_name' if needed
    data.pupils.forEach(p => {
        if (!p.first_name || !p.last_name) {
            let parts = (p.name || "Unknown Pupil").split(" ");
            p.first_name = parts[0];
            p.last_name = parts.slice(1).join(" ");
            p.name = p.first_name + " " + p.last_name; // Keep for backwards compatibility
        }
        if (p.performance === undefined) {
            p.performance = 3;
        }
    });

    function updatePerformance(index, value) {
        data.pupils[index].performance = parseInt(value, 10);
        savePupils();
        // Update textual display of value if desired
        document.getElementById(`perf-val-${index}`).innerText = value;
    }

    function renderPupils() {
        const tbody = document.getElementById('pupil-table');
        tbody.innerHTML = '';
        
        if (data.pupils.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#666;">No pupils added yet.</td></tr>';
            return;
        }

        data.pupils.forEach((p, index) => {
            let tr = document.createElement('tr');
            
            let tdFirst = document.createElement('td');
            tdFirst.innerText = p.first_name;
            tr.appendChild(tdFirst);
            
            let tdLast = document.createElement('td');
            tdLast.innerText = p.last_name;
            tr.appendChild(tdLast);
            
            let tdPerf = document.createElement('td');
            let perfVal = p.performance || 3;
            tdPerf.innerHTML = `
                <div style="display:flex; align-items:center; gap:10px;">
                    <input type="range" min="1" max="5" value="${perfVal}" 
                           onchange="updatePerformance(${index}, this.value)">
                    <span id="perf-val-${index}" style="min-width: 1em;">${perfVal}</span>
                </div>
            `;
            tr.appendChild(tdPerf);
            
            let tdAction = document.createElement('td');
            tdAction.innerHTML = `<button class="error" onclick="deletePupil(${index})" style="padding: 0.2rem 0.5rem;"><i class="fa-solid fa-trash-can"></i> Delete</button>`;
            tr.appendChild(tdAction);
            
            tbody.appendChild(tr);
        });
    }

    function generateId() {
        return 'p-' + Math.random().toString(36).substr(2, 9);
    }

    function addPupil() {
        const inputFirst = document.getElementById('new-pupil-first');
        const inputLast = document.getElementById('new-pupil-last');
        const firstName = inputFirst.value.trim();
        const lastName = inputLast.value.trim();
        
        if (firstName || lastName) {
            const newName = firstName + " " + lastName;
            const newId = generateId();
            data.pupils.push({ 
                id: newId, 
                first_name: firstName, 
                last_name: lastName,
                name: newName.trim(), 
                performance: 3,
                sit_next_to: [], 
                avoid: [] 
            });
            inputFirst.value = '';
            inputLast.value = '';
            renderPupils();
            savePupils();
        }
    }

    function deletePupil(index) {
        if (!confirm("Are you sure you want to remove this pupil?")) return;
        data.pupils.splice(index, 1);
        renderPupils();
        savePupils();
    }

    function savePupils() {
        fetch('/class/' + className + '/pupils', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        })
        .then(res => {
            if (!res.ok) throw new Error("Failed to save");
            return res.json();
        })
        .then(res => {
            showToast('Pupils saved successfully');
        })
        .catch(err => {
            console.error(err);
            showToast('Error saving pupils', 'error');
        });
    }

    renderPupils();
</script>
{% endblock %}
