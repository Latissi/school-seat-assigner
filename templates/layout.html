{% extends "base.html" %}
{% block title %}{{ class_name }} Layout Editor{% endblock %}

{% block head %}
<style>
#grid-container {
    display: inline-grid;
    gap: 10px;
    background: #f0f0f0;
    padding: 10px;
    border: 1px solid #ccc;
    user-select: none;
}
.grid-cell {
    width: 60px;
    height: 60px;
    background: #fff;
    border: 1px dashed #ccc;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 0.7em;
    position: relative;
    box-sizing: border-box;
}
.grid-cell.is-seat {
    background: #e0f7fa;
    border: 2px solid #00acc1;
}
.grid-cell .tag-label {
    font-size: 0.8em;
    color: #666;
    position: absolute;
    bottom: 2px;
}
.grid-cell.front-tag { border-top: 5px solid #f44336; }
.grid-cell.back-tag { border-bottom: 5px solid #4caf50; }
.teacher-desk {
    background: #4a5568;
    color: white;
    text-align: center;
    padding: 15px;
    margin-bottom: 20px;
    border-radius: 4px;
    font-weight: bold;
    letter-spacing: 1px;
}
.layout-editor {
        display: flex;
        gap: 1rem;
        align-items: flex-start;
        flex-wrap: nowrap;
        overflow-x: auto;
}
.layout-main {
        flex: 1 1 auto;
        min-width: 0;
}
.layout-tools {
        flex: 0 0 320px;
}

.classroom-wrapper {
    display: inline-flex;
    flex-direction: column;
    align-items: stretch;
}
.tool-option {
    display: block;
    margin-bottom: 0.5em;
}
.tool-option input[type="radio"] {
    display: none;
}
.tool-option .btn-surface {
    padding: 0.5em 1em;
    border: 2px solid #ccc;
    border-radius: 4px;
    background: #fff;
    cursor: pointer;
    transition: all 0.2s;
    color: #333;
    display: block;
}
.tool-option input[type="radio"]:checked + .btn-surface {
    border-color: #00acc1;
    background: #e0f7fa;
    color: #007c8a;
    font-weight: bold;
    box-shadow: 0 0 5px rgba(0, 172, 193, 0.4);
}
.tool-group-title {
    font-size: 0.85em;
    text-transform: uppercase;
    color: #666;
    margin-bottom: 0.5em;
    margin-top: 1em;
    letter-spacing: 0.5px;
}
</style>

{% endblock %}

{% block content %}
<div class="layout-editor">
    <div class="layout-main">
    <h2><i class="fa-solid fa-border-all"></i> Layout Editor: {{ class_name }}</h2>
    <div class="classroom-wrapper">
      <div class="teacher-desk"><i class="fa-solid fa-person-chalkboard"></i> FRONT OF CLASSROOM / TEACHER DESK</div>
      <div id="grid-container"></div>
    </div>
  </div>
    <div class="layout-tools">
    <div class="card" style="padding: 1em;">
      <h3><i class="fa-solid fa-border-none"></i> Grid Settings</h3>
      <label>Rows: <input type="number" id="grid-rows" value="8" min="1"></label>
      <label>Cols: <input type="number" id="grid-cols" value="10" min="1"></label>
      <button class="pseudo" onclick="initGrid()"><i class="fa-solid fa-arrows-rotate"></i> Resize Grid</button>
      <hr>
      <h3><i class="fa-solid fa-pen-ruler"></i> Edit Mode</h3>
      <div class="tool-group-title" style="margin-top: 0;">Placement</div>
      <label class="tool-option"><input type="radio" name="tool" value="toggle_seat" checked> <span class="btn-surface"><i class="fa-solid fa-plus-minus"></i> Add / Remove Seat</span></label>
      
      <div class="tool-group-title">Seat Tags</div>
      <label class="tool-option"><input type="radio" name="tool" value="tag_front"> <span class="btn-surface"><i class="fa-solid fa-arrow-up"></i> Mark Front Row</span></label>
      <label class="tool-option"><input type="radio" name="tool" value="tag_back"> <span class="btn-surface"><i class="fa-solid fa-arrow-down"></i> Mark Back Row</span></label>
      <label class="tool-option"><input type="radio" name="tool" value="tag_middle"> <span class="btn-surface"><i class="fa-solid fa-left-right"></i> Mark Middle (Standard)</span></label>
      <hr>
      <button class="success" onclick="saveLayout()"><i class="fa-solid fa-floppy-disk"></i> Save Layout</button>
    </div>
  </div>
</div>

<script>
    const className = "{{ class_name }}";
    let layout = {{ layout | tojson | safe }};
    
    let gridRows = layout.height || 8;
    let gridCols = layout.width || 10;
    let gridSeats = layout.seats || [];
    
    document.getElementById('grid-rows').value = gridRows;
    document.getElementById('grid-cols').value = gridCols;
    
    // Convert array of seats to dictionary for fast lookup
    let seatMap = {};
    if (gridSeats.length > 0) {
        gridSeats.forEach(s => {
            seatMap[`${s.row_idx}-${s.col_idx}`] = s;
        });
    } else if (layout.rows) {
        // Migration from old layout format if it exists
        layout.rows.forEach((r, r_idx) => {
            let col = 0;
            r.groups.forEach(g => {
                g.seats.forEach(s => {
                    let tag = s.tag || 'middle';
                    seatMap[`${r_idx}-${col}`] = { id: `r${r_idx}c${col}`, row_idx: r_idx, col_idx: col, tag: tag };
                    col++;
                });
                col++; // gap between groups
            });
        });
    }

    function initGrid() {
        gridRows = parseInt(document.getElementById('grid-rows').value) || 8;
        gridCols = parseInt(document.getElementById('grid-cols').value) || 10;
        
        let container = document.getElementById('grid-container');
        container.style.gridTemplateRows = `repeat(${gridRows}, 60px)`;
        container.style.gridTemplateColumns = `repeat(${gridCols}, 60px)`;
        container.innerHTML = '';
        
        for (let r = 0; r < gridRows; r++) {
            for (let c = 0; c < gridCols; c++) {
                let cell = document.createElement('div');
                cell.className = 'grid-cell';
                let key = `${r}-${c}`;
                
                if (seatMap[key]) {
                    cell.classList.add('is-seat');
                    let tag = seatMap[key].tag;
                    if (tag === 'front') cell.classList.add('front-tag');
                    if (tag === 'back') cell.classList.add('back-tag');
                    cell.innerHTML = `<strong>${seatMap[key].id}</strong><span class="tag-label">${tag}</span>`;
                }
                
                cell.onclick = () => onCellClick(r, c);
                container.appendChild(cell);
            }
        }
    }

    function onCellClick(r, c) {
        const tool = document.querySelector('input[name="tool"]:checked').value;
        const key = `${r}-${c}`;
        
        if (tool === 'toggle_seat') {
            if (seatMap[key]) {
                delete seatMap[key];
            } else {
                seatMap[key] = { id: `s-${r}-${c}`, row_idx: r, col_idx: c, tag: 'middle' };
            }
        } else if (seatMap[key]) {
            if (tool === 'tag_front') seatMap[key].tag = 'front';
            if (tool === 'tag_back') seatMap[key].tag = 'back';
            if (tool === 'tag_middle') seatMap[key].tag = 'middle';
        }
        
        initGrid(); 
    }

    function saveLayout() {
        let seatsArray = Object.values(seatMap);
        let curLayout = {
            width: gridCols,
            height: gridRows,
            seats: seatsArray
        };
        
        fetch('/class/' + className + '/layout', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(curLayout)
        }).then(res => res.json()).then(data => {
            if(data.status==="success") alert("Saved Layout Successfully!");
        });
    }

    initGrid();
</script>
{% endblock %}
